<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- Altes Kontaktformular (Kompatibilität) -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="bot-field" />
      <input type="hidden" name="source" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="topic" type="text" />
      <textarea name="message"></textarea>
    </form>

    <!-- Erweitertes Projektstart-Formular -->
    <form name="projektstart" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="projektstart" />
      <input type="hidden" name="bot-field" />
      <input name="name" type="text" />
      <input name="unternehmen" type="text" />
      <input name="email" type="email" />
      <input name="telefon" type="tel" />
      <input name="website_status" type="text" />
      <input name="website_url" type="url" />
      <input name="leistungen" type="text" />
      <input name="branche" type="text" />
      <input name="dringlichkeit" type="text" />
      <input name="budget" type="text" />
      <input name="ziele" type="text" />
      <textarea name="nachricht"></textarea>
    </form>

    <!-- Social Media Anfrage-Formular -->
    <form name="social-media-anfrage" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="social-media-anfrage" />
      <input type="hidden" name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="typ" type="text" />
      <input name="plattformen" type="text" />
      <input name="material" type="text" />
      <input name="referenzen" type="text" />
      <input name="ziele" type="text" />
      <textarea name="nachricht"></textarea>
    </form>
  </body>
</html>
